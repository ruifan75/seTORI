name: CI

# 検査に加えて、main への push では本番用イメージを GHCR へ発行する。
# VPS 側は pull するだけ（`deploy/deploy.sh`）。1GB の本番機で
# `npm ci && vite build` を回さずに済ませるのが主目的。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同じブランチに続けて push した場合、古い実行は打ち切る
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Test
        working-directory: backend
        run: go test ./...

      - name: gofmt（整形漏れの検出）
        working-directory: backend
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下のファイルが gofmt されていません:"
            echo "$unformatted"
            exit 1
          fi

  frontend:
    name: Frontend (typecheck + lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # tsc --noEmit はプロジェクト参照構成では何も検査しないため -b を使う
      - name: Typecheck
        working-directory: frontend
        run: npx tsc -b

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  images:
    name: Docker images
    runs-on: ubuntu-latest
    # 検査を通っていないものを発行しない
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: メタデータ（イメージに埋めるバージョンと、発行するかどうか）
        id: meta
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      # PR では組めることの確認だけで、発行はしない。
      # login-action を使わないのは、バージョン固定を1つ減らすため。
      - name: GHCR へログイン
        if: steps.meta.outputs.push == 'true'
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      # ⚠️ イメージ名はハードコードする。リポジトリ名 seTORI には大文字が含まれ、
      # GHCR は大文字を受け付けないため ${{ github.repository }} は使えない。
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/setori-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/setori-backend:main
          build-args: |
            GIT_COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_TIME=${{ steps.meta.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/setori-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/setori-frontend:main
          build-args: |
            GIT_COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_TIME=${{ steps.meta.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
