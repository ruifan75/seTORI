name: CI

# デプロイはしない。壊れたものが main に入るのを防ぐための検査だけ。
# 本番への反映は VPS 上で `git pull && docker compose up -d --build`（deploy/README.md 参照）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同じブランチに続けて push した場合、古い実行は打ち切る
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Test
        working-directory: backend
        run: go test ./...

      - name: gofmt（整形漏れの検出）
        working-directory: backend
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下のファイルが gofmt されていません:"
            echo "$unformatted"
            exit 1
          fi

  frontend:
    name: Frontend (typecheck + lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # tsc --noEmit はプロジェクト参照構成では何も検査しないため -b を使う
      - name: Typecheck
        working-directory: frontend
        run: npx tsc -b

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  images:
    name: Docker images
    runs-on: ubuntu-latest
    # 本番と同じ手順でイメージが組めることの確認。レジストリへは push しない
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
